[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gameplay-clipper"
version = "0.1.0"
description = "游戏实况剪辑工具集：裁剪、拼接转场、BGM 混音、压缩转码、精彩集锦"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "gameplay-clipper contributors" }]
# 运行时依赖暂不引入，等具体功能确定后再添加（视频底层候选：ffmpeg 命令行 / moviepy 等）
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
